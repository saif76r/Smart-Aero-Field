<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="marketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#581C87" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Soft Lavender Rounded Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#marketBg)"/>
  
  <!-- Open Price Register / Ledger -->
  <g filter="url(#bookShadow)">
    <path d="M32 20c-5-4-12-4-17-2v24c5-2 12-2 17 2 5-4 12-4 17-2V18c-5-2-12-2-17 2z" fill="#FFFFFF" stroke="#7E22CE" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Center Spine -->
    <line x1="32" y1="20" x2="32" y2="44" stroke="#7E22CE" stroke-width="2.5"/>
    
    <!-- Ledger Lines -->
    <line x1="19" y1="26" x2="28" y2="25" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19" y1="31" x2="28" y2="30" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19" y1="36" x2="26" y2="35" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Price Tags & Taka Symbol (৳) on right page -->
    <text x="37" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#7E22CE">৳</text>
    <path d="M44 38l4-4" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    <path d="M48 34h-3v3" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
