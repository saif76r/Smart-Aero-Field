<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rainCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Soft Background Glow -->
  <circle cx="32" cy="32" r="28" fill="#EFF6FF"/>
  
  <!-- Cloud Body -->
  <g filter="url(#shadow)">
    <path d="M44 38H20a10 10 0 0 1-1.3-19.9 14 14 0 0 1 26.6-3.1A9 9 0 0 1 44 38z" fill="url(#rainCloud)"/>
    <!-- Highlight Reflection -->
    <path d="M26 15a12 12 0 0 1 15 1.5c-3-1-7-.5-9.5 1.5-2 1.6-3.2 4-3.5 6.5A8 8 0 0 1 20 22a8 8 0 0 1 6-7z" fill="#93C5FD" opacity="0.6"/>
  </g>
  
  <!-- Raindrops -->
  <g fill="url(#dropGrad)">
    <path d="M22 43c0 2-1.5 3.5-3.5 3.5S15 45 15 43c0-2.5 3.5-6.5 3.5-6.5s3.5 4 3.5 6.5z"/>
    <path d="M34 45c0 2.2-1.8 4-4 4s-4-1.8-4-4c0-3 4-7.5 4-7.5s4 4.5 4 7.5z"/>
    <path d="M46 43c0 2-1.5 3.5-3.5 3.5S39 45 39 43c0-2.5 3.5-6.5 3.5-6.5s3.5 4 3.5 6.5z"/>
  </g>
</svg>
