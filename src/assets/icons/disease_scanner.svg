<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="leafShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Light Mint Background Circle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#scanBg)"/>
  
  <!-- Scanner Corners / Viewfinder Bracket -->
  <g stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14 22V14h8"/>
    <path d="M50 22V14h-8"/>
    <path d="M14 42v8h8"/>
    <path d="M50 42v8h-8"/>
  </g>
  
  <!-- Central Leaf with Disease Diagnostic Reticle -->
  <g filter="url(#leafShadow)">
    <path d="M32 18c8 0 16 7 16 16 0 10-8 16-16 16s-16-6-16-16c0-9 8-16 16-16z" fill="url(#leafGrad)"/>
    <!-- Leaf Center Stem -->
    <path d="M32 20v28M32 28l6-5M32 36l7-4M32 32l-6-5M32 40l-6-4" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  
  <!-- Laser Beam Line -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.85"/>
  <circle cx="32" cy="32" r="3" fill="#EF4444"/>
</svg>
