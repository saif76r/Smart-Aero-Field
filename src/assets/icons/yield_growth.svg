<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="yieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <filter id="arrowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#115E59" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Soft Mint Rounded Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#yieldBg)"/>
  
  <!-- Bar Charts in Background -->
  <rect x="15" y="38" width="7" height="14" rx="2" fill="#99F6E4"/>
  <rect x="26" y="30" width="7" height="22" rx="2" fill="#5EEAD4"/>
  <rect x="37" y="24" width="7" height="28" rx="2" fill="#2DD4BF"/>
  
  <!-- Bold Upward Rocketing Trend Arrow -->
  <g filter="url(#arrowShadow)">
    <path d="M14 42l12-11 10 7 14-16" fill="none" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 22h10v10" fill="none" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Golden Harvest Sparkle -->
  <circle cx="48" cy="18" r="3" fill="#F59E0B"/>
  <path d="M48 13v2M48 21v2M43 18h2M51 18h2" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
</svg>
