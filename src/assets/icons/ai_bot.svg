<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="botBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5128"/>
      <stop offset="100%" stop-color="#14391C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="botShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Deep Emerald Green Circular Avatar Base -->
  <circle cx="32" cy="32" r="28" fill="url(#botBg)"/>
  
  <!-- AI Bot Head & Agricultural Antenna -->
  <g filter="url(#botShadow)">
    <!-- Sprout / Antenna -->
    <path d="M32 18v-5M32 13c3-3 7-2 8 0s-3 4-8 2" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bot Head Frame -->
    <rect x="18" y="20" width="28" height="22" rx="7" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Bot Ears / Side Sensors -->
    <line x1="14" y1="31" x2="18" y2="31" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="31" x2="50" y2="31" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glowing Friendly Eyes -->
    <ellipse cx="26" cy="30" rx="2.5" ry="4" fill="url(#goldGrad)"/>
    <ellipse cx="38" cy="30" rx="2.5" ry="4" fill="url(#goldGrad)"/>
    
    <!-- Cheerful Smile Line -->
    <path d="M28 36q4 3 8 0" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
