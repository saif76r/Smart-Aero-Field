<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="soilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="soilLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="flaskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Warm Ivory Rounded Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#soilBg)"/>
  
  <!-- Laboratory Flask -->
  <g filter="url(#flaskShadow)">
    <!-- Flask Outline -->
    <path d="M28 14h8v8l12 22a4 4 0 0 1-3.5 6H19.5A4 4 0 0 1 16 44L28 22v-8z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Flask Lip -->
    <rect x="26" y="11" width="12" height="4" rx="2" fill="#B45309"/>
    
    <!-- Strata Soil Liquid inside Flask -->
    <path d="M20.5 38l4.5-8h14l4.5 8c.5 1 .7 2 .5 3l-1.5 5a2 2 0 0 1-2 1.5h-17a2 2 0 0 1-2-1.5l-1.5-5c-.2-1 0-2 .5-3z" fill="url(#soilLiquid)"/>
    
    <!-- Soil Mineral Bubbles / Micro-Nutrients NPK -->
    <circle cx="28" cy="42" r="2" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="36" cy="40" r="2.5" fill="#FDE68A" opacity="0.9"/>
    <circle cx="32" cy="45" r="1.5" fill="#FEF3C7" opacity="0.9"/>
  </g>
  
  <!-- Sprouting Plant Seedling emerging from Flask -->
  <path d="M32 26V18c0-3 3-5 5-5s4 3 4 5-3 5-5 5" fill="#10B981" stroke="#047857" stroke-width="1.5"/>
  <path d="M32 22c0-3-3-4-5-4s-4 2-4 4 3 4 5 4" fill="#34D399" stroke="#047857" stroke-width="1.5"/>
</svg>
